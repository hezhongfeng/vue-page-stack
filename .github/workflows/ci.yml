name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }}, Vue ${{ matrix.vue }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 20
            vue: 3.3.4
            vue_router: 4.2.2
          - node: 22
            vue: 3.5.31
            vue_router: 4.6.4

    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Switch Vue compatibility target
        run: pnpm add --no-save vue@${{ matrix.vue }} vue-router@${{ matrix.vue_router }}

      - name: Run lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm run test:run

      - name: Run build
        run: pnpm run build
